name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

# silențiază avertismentul de deprecare Node 20 (rulează pe Node 24)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verifică secretul de deploy
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALUMACONTRACTE }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Lipsește secretul FIREBASE_SERVICE_ACCOUNT_ALUMACONTRACTE (JSON service account). Adaugă-l în Settings → Secrets → Actions."
            exit 1
          fi

      - name: Install deps
        run: npm ci

      - name: Build web
        env:
          VITE_PROXY_BASE: ${{ secrets.VITE_PROXY_BASE }}
          VITE_PROXY_TOKEN: ${{ secrets.VITE_PROXY_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Deploy hosting (firebase-tools)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALUMACONTRACTE }}
        run: |
          printf '%s' "$FIREBASE_SA_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@15 deploy \
            --only hosting \
            --project alumacontracte \
            --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
