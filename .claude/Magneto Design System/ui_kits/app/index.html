<title>MagnetoApp — UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0a0a0a; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 24px 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: translateY(0); } }
  .anim-fade { animation: fadeIn 0.5s cubic-bezier(0.34,1.2,0.64,1) both; }
  .anim-slide { animation: slideUp 0.35s cubic-bezier(0.34,1.2,0.64,1) both; }
  input::placeholder { color: #A3A3A3; }
  input, button, textarea { font-family: 'Plus Jakarta Sans', sans-serif; }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
</style>

<div id="root"></div>
<script type="text/babel" src="components/Theme.jsx"></script>

// ─── ICONS ───────────────────────────────────────────────────
const Ico = ({ d, w=20, c='currentColor', fill='none', sw=2 }) =>
  <svg width={w} height={w} viewBox="0 0 24 24" fill={fill} stroke={c} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
    {d.map((p,i) => p.startsWith('M')||p.startsWith('L')||p.startsWith('A')||p.startsWith('C')||p.startsWith('Q')||p.startsWith('Z') ? <path key={i} d={p}/> : null)}
  </svg>;

const IcoPower    = ({c,s=20})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||'currentColor'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18.36 6.64a9 9 0 11-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>;
const IcoWallet   = ({c,s=22})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||'currentColor'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>;
const IcoCalendar = ({c,s=20})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||'currentColor'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
const IcoTrophy   = ({c,s=20})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||'currentColor'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 010-5H6"/><path d="M18 9h1.5a2.5 2.5 0 000-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0012 0V2z"/></svg>;
const IcoDollar   = ({c,s=22})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||'currentColor'} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>;
const IcoUsers    = ({c,s=20})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||'currentColor'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>;
const IcoBox      = ({c,s=20})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||'currentColor'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>;
const IcoLocation = ({c,s=16})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||'currentColor'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>;
const IcoFlame    = ({c,s=16})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||'currentColor'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 01-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z"/></svg>;
const IcoMail     = ({c,s=18})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||'currentColor'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></svg>;
const IcoLock     = ({c,s=18})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||'currentColor'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>;
const IcoEye      = ({c,s=18})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||'currentColor'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>;
const IcoArrow    = ({c,s=18})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||'currentColor'} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>;
const IcoHome     = ({c,s=22})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||'currentColor'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
const IcoShield   = ({c,s=16})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||'currentColor'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;
const IcoCheck    = ({c,s=16})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||'currentColor'} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
const IcoChevron  = ({c,s=16,dir='right'})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||'currentColor'} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">{dir==='right'?<polyline points="9 18 15 12 9 6"/>:<polyline points="15 18 9 12 15 6"/>}</svg>;
const IcoEdit     = ({c,s=16})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||'currentColor'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
const IcoUser     = ({c,s=20})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||'currentColor'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
const IcoCamera   = ({c,s=20})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||'currentColor'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>;
const IcoSettings = ({c,s=20})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||'currentColor'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>;

// ─── SHARED COMPONENTS ────────────────────────────────────────
function Phone({ children, theme }) {
  const c = theme.colors;
  return (
    <div style={{ width: 390, minHeight: 760, background: c.bg, borderRadius: 44, overflow: 'hidden', boxShadow: '0 40px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06)', display: 'flex', flexDirection: 'column', position: 'relative' }}>
      <div style={{ background: c.bg, padding: '14px 28px 8px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexShrink: 0 }}>
        <span style={{ fontSize: 13, fontWeight: 800, color: c.text }}>9:41</span>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="3" width="3" height="9" rx="1" fill={c.text} opacity="0.4"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill={c.text} opacity="0.6"/><rect x="9" y="0" width="3" height="12" rx="1" fill={c.text}/></svg>
          <svg width="15" height="12" viewBox="0 0 24 24" fill="none" stroke={c.text} strokeWidth="2"><path d="M5 12.55a11 11 0 0114.08 0"/><path d="M1.42 9a16 16 0 0121.16 0"/><path d="M8.53 16.11a6 6 0 016.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
          <div style={{ width: 22, height: 11, borderRadius: 3, border: `1px solid ${c.text}`, padding: '2px', display: 'flex', alignItems: 'center' }}>
            <div style={{ width: '80%', height: '100%', background: c.success, borderRadius: 2 }}/>
          </div>
        </div>
      </div>
      <div style={{ flex: 1, overflowY: 'auto', overflowX: 'hidden' }}>{children}</div>
      <div style={{ background: c.bg, display: 'flex', justifyContent: 'center', paddingBottom: 10, paddingTop: 8, flexShrink: 0 }}>
        <div style={{ width: 120, height: 5, background: c.text, opacity: 0.2, borderRadius: 99 }}/>
      </div>
    </div>
  );
}

function TabBar({ theme, active, onNav }) {
  const c = theme.colors;
  const tabs = [
    { id: 'home', label: 'Acasă', icon: (a) => <IcoHome c={a?c.brand:c.tabInactive} s={22}/> },
    { id: 'events', label: 'Events', icon: (a) => <IcoCalendar c={a?c.brand:c.tabInactive} s={22}/> },
    { id: 'incasari', label: 'Plăți', icon: (a) => <IcoDollar c={a?c.brand:c.tabInactive} s={22}/> },
    { id: 'profil', label: 'Profil', icon: (a) => <IcoUser c={a?c.brand:c.tabInactive} s={22}/> },
  ];
  return (
    <div style={{ position: 'sticky', bottom: 0, background: c.surface, borderTop: `1px solid ${c.border}`, display: 'flex', padding: '8px 0 10px', zIndex: 50, boxShadow: theme.softShadow }}>
      {tabs.map(t => {
        const isActive = active === t.id;
        return (
          <button key={t.id} onClick={() => onNav(t.id)} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, background: 'none', border: 'none', cursor: 'pointer', padding: '4px 0' }}>
            {t.icon(isActive)}
            <span style={{ fontSize: 10, fontWeight: 700, color: isActive ? c.brand : c.tabInactive }}>{t.label}</span>
            {isActive && <div style={{ width: 4, height: 4, borderRadius: 2, background: c.brand }}/>}
          </button>
        );
      })}
    </div>
  );
}

function SectionLabel({ children, theme, style={} }) {
  return <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: '1px', textTransform: 'uppercase', color: theme.colors.textSecondary, marginBottom: 10, ...style }}>{children}</div>;
}

// ─── LOGIN ────────────────────────────────────────────────────
function LoginScreen({ theme, onLogin }) {
  const c = theme.colors;
  const [email, setEmail] = React.useState('');
  const [pw, setPw] = React.useState('');
  const [showPw, setShowPw] = React.useState(false);
  const [remember, setRemember] = React.useState(false);
  const grad = theme.isDark ? 'linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#312e81 100%)' : 'linear-gradient(135deg,#f8fafc 0%,#e0e7ff 60%,#4f46e5 100%)';
  return (
    <div style={{ minHeight: '100%', background: grad, display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', padding: 20, position: 'relative', overflow: 'hidden' }}>
      <div style={{ position: 'absolute', top: -80, left: -60, width: 240, height: 240, borderRadius: '50%', background: c.brand, opacity: 0.15, filter: 'blur(40px)', pointerEvents: 'none' }}/>
      <div style={{ position: 'absolute', bottom: -80, right: -60, width: 240, height: 240, borderRadius: '50%', background: c.accentSecondary, opacity: 0.15, filter: 'blur(40px)', pointerEvents: 'none' }}/>
      <div className="anim-fade" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', marginBottom: 28 }}>
        <div style={{ width: 110, height: 110, borderRadius: 55, background: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 10px 30px rgba(0,0,0,0.3)', overflow: 'hidden' }}>
          <img src="../../assets/logo_magneto.png" style={{ width: '90%', height: '90%', objectFit: 'contain' }} alt="Logo"/>
        </div>
        <p style={{ marginTop: 14, fontSize: 13, fontWeight: 700, color: theme.isDark ? '#cbd5e1' : '#737373', textAlign: 'center' }}>"Surprinde emoția din fiecare cadru."</p>
      </div>
      <div className="anim-slide" style={{ width: '100%', maxWidth: 350, background: theme.isDark ? 'rgba(30,41,59,0.65)' : 'rgba(255,255,255,0.9)', backdropFilter: 'blur(20px)', border: `1px solid ${theme.isDark ? 'rgba(255,255,255,0.1)' : '#fff'}`, borderRadius: 24, padding: 22, boxShadow: '0 10px 40px rgba(0,0,0,0.2)' }}>
        <FormInput label="Email" placeholder="fotograf@magneto.ro" value={email} onChange={e=>setEmail(e.target.value)} leftIcon={<IcoMail c={c.subText}/>}/>
        <FormInput label="Parolă" placeholder="••••••••" type={showPw?'text':'password'} value={pw} onChange={e=>setPw(e.target.value)} leftIcon={<IcoLock c={c.subText}/>} rightIcon={<span style={{cursor:'pointer'}} onClick={()=>setShowPw(p=>!p)}><IcoEye c={c.subText}/></span>}/>
        <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:4, marginBottom:18, cursor:'pointer' }} onClick={()=>setRemember(r=>!r)}>
          <div style={{ width:18, height:18, borderRadius:5, border:`2px solid ${remember?c.brand:c.subText}`, background:remember?c.brand:'transparent', display:'flex', alignItems:'center', justifyContent:'center' }}>
            {remember && <IcoCheck c="#fff" s={12}/>}
          </div>
          <span style={{ fontSize:13, color:c.subText }}>Reține-mă</span>
        </div>
        <AppButton variant="gradient" label="Conectare" icon={<IcoArrow c="#fff" s={18}/>} iconPosition="right" size="lg" fullWidth onPress={()=>onLogin('photographer')}/>
        <button onClick={()=>onLogin('admin')} style={{ marginTop:12, width:'100%', background:'none', border:'none', cursor:'pointer', color:c.subText, fontSize:13 }}>
          Admin? <span style={{ color:c.brand, fontWeight:700 }}>Intră ca Admin →</span>
        </button>
      </div>
    </div>
  );
}

// ─── PHOTOGRAPHER HOME ────────────────────────────────────────
function PhotographerHome({ theme, onNav }) {
  const c = theme.colors;
  const [incasareOpen, setIncasareOpen] = React.useState(false);
  const [amount, setAmount] = React.useState('');
  const [method, setMethod] = React.useState('Cash');
  const progress = 68;
  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%' }}>
      <div style={{ flex:1, overflowY:'auto', padding:'0 20px 16px' }}>
        {/* Header */}
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16, paddingTop:4 }}>
          <div style={{ display:'flex', alignItems:'center', gap:12 }}>
            <div style={{ width:44, height:44, borderRadius:14, background:`linear-gradient(135deg,${c.brand},${c.accentSecondary})`, padding:2 }}>
              <img src="../../assets/img_avatar.png" style={{ width:'100%', height:'100%', borderRadius:12, objectFit:'cover' }} alt=""/>

            <div>
              <div style={{ fontSize:11, color:c.subText, fontWeight:700 }}>Bună ziua ☀️</div>

            </div>
          </div>

              {theme.isDark?<IcoSun c={c.text} s={17}/>:<IcoMoon c={c.text} s={17}/>}
            </button>
            <div style={{ position:'relative' }}>
              <button style={{ width:38, height:38, borderRadius:11, border:`1px solid ${c.border}`, background:c.surface, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}>
                <IcoBell c={c.text} s={17}/>
              </button>
              <div style={{ position:'absolute', top:-4, right:-4, width:17, height:17, borderRadius:9, background:c.danger, display:'flex', alignItems:'center', justifyContent:'center', fontSize:9, fontWeight:900, color:'#fff' }}>3</div>
            </div>
          </div>
        </div>
        {/* Quote */}
        <div style={{ background:c.card, borderRadius:14, padding:'11px 14px', borderLeft:`4px solid ${c.brand}`, border:`1px solid ${c.border}`, borderLeftWidth:4, marginBottom:14, boxShadow:theme.softShadow }}>
          <p style={{ fontSize:13, fontStyle:'italic', fontWeight:600, color:c.text, lineHeight:'20px' }}>"Ești pe val! Ține ritmul."</p>
        </div>
        {/* Next event */}
        <div style={{ background:c.card, borderRadius:18, padding:14, border:`1px solid ${c.border}`, boxShadow:theme.softShadow, marginBottom:14 }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8 }}>

          {[
            { label:'Editează Profil', icon:<IcoUser c={c.brand} s={18}/>, col:c.brand },
            { label:'Notificări', icon:<IcoBell c={c.warning} s={18}/>, col:c.warning },
            { label:'Setări Aplicație', icon:<IcoSettings c={c.textSecondary} s={18}/>, col:c.textSecondary },
          ].map((row,i,arr)=>(
            <button key={i} style={{ width:'100%', display:'flex', alignItems:'center', gap:12, padding:'14px 16px', background:'none', border:'none', borderBottom:i<arr.length-1?`1px solid ${c.separator}`:'none', cursor:'pointer', textAlign:'left' }}>

        {/* Dark mode toggle prominent */}
        <div style={{ background:c.card, borderRadius:16, border:`1px solid ${c.border}`, boxShadow:theme.softShadow, overflow:'hidden', marginBottom:14 }}>
          <button onClick={()=>onNav('toggle-theme')} style={{ width:'100%', display:'flex', alignItems:'center', gap:12, padding:'14px 16px', background:'none', border:'none', cursor:'pointer' }}>
            <div style={{ width:36, height:36, borderRadius:10, background:`${c.brand}18`, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>

      <TabBar theme={theme} active="profil" onNav={onNav}/>
    </div>
  );
}

// ─── ROOT APP ─────────────────────────────────────────────────
function AppShell() {
  const { theme, toggleTheme } = useTheme();
  const [screen, setScreen] = React.useState('login');
  const [role, setRole] = React.useState(null);

  const handleLogin = (r) => { setRole(r); setScreen(r==='admin'?'admin':'home'); };
  const handleNav = (action) => {
    if (action==='toggle-theme') { toggleTheme(); return; }
    if (action==='logout') { setScreen('login'); setRole(null); return; }
    setScreen(action);
  };

  const screens = role==='admin'
    ? ['admin']
    : ['home','events','incasari','gamification','profil'];

  const screenLabels = {
    login:'Login', home:'Home', events:'Events', incasari:'Încasări',
    gamification:'Top & Target', profil:'Profil', admin:'Admin'
  };

  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:24 }}>
      {/* Top controls */}
      <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:10 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <img src="../../assets/logo_magneto.png" style={{ width:32, height:32, objectFit:'contain', background:'#fff', borderRadius:16 }} alt=""/>
          <span style={{ fontSize:18, fontWeight:900, background:'linear-gradient(to right,#34CAE8,#6366F1)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent' }}>MagnetoApp</span>
        </div>
        {/* Screen switcher */}
        <div style={{ display:'flex', flexWrap:'wrap', gap:6, justifyContent:'center', maxWidth:420 }}>
          <button onClick={()=>{setScreen('login');setRole(null);}} style={{ padding:'5px 12px', borderRadius:999, border:'1px solid rgba(255,255,255,0.15)', background:screen==='login'?'#6366F1':'rgba(255,255,255,0.06)', color:'#fff', cursor:'pointer', fontSize:11, fontWeight:700 }}>Login</button>
          {['home','events','incasari','gamification','profil'].map(s=>(
            <button key={s} onClick={()=>{setRole('photographer');setScreen(s);}} style={{ padding:'5px 12px', borderRadius:999, border:'1px solid rgba(255,255,255,0.15)', background:screen===s?'#6366F1':'rgba(255,255,255,0.06)', color:'#fff', cursor:'pointer', fontSize:11, fontWeight:700 }}>
              📷 {screenLabels[s]}
            </button>
          ))}
          <button onClick={()=>handleLogin('admin')} style={{ padding:'5px 12px', borderRadius:999, border:'1px solid rgba(255,255,255,0.15)', background:screen==='admin'?'#6366F1':'rgba(255,255,255,0.06)', color:'#fff', cursor:'pointer', fontSize:11, fontWeight:700 }}>🛡️ Admin</button>
        </div>
        {/* Dark mode toggle */}
        <button onClick={()=>handleNav('toggle-theme')} style={{ display:'flex', alignItems:'center', gap:8, padding:'7px 16px', borderRadius:999, border:'1px solid rgba(255,255,255,0.15)', background:'rgba(255,255,255,0.06)', color:'#fff', cursor:'pointer', fontSize:12, fontWeight:700 }}>
          {theme.isDark?<IcoSun c="#fff" s={14}/>:<IcoMoon c="#fff" s={14}/>}
          {theme.isDark?'Mod luminos':'Mod întunecat'}
        </button>
      </div>

      {/* Phone frame */}
      <Phone theme={theme}>
        {screen==='login' && <LoginScreen theme={theme} onLogin={handleLogin}/>}
        {screen==='home' && <PhotographerHome theme={theme} onNav={handleNav}/>}
        {screen==='events' && <EventsScreen theme={theme} onNav={handleNav}/>}
        {screen==='incasari' && <IncasariScreen theme={theme} onNav={handleNav}/>}
        {screen==='gamification' && <GamificationScreen theme={theme} onNav={handleNav}/>}
        {screen==='profil' && <ProfilScreen theme={theme} onNav={handleNav}/>}
        {screen==='admin' && <AdminDashboard theme={theme} onNav={handleNav}/>}
      </Phone>

      <p style={{ color:'rgba(255,255,255,0.25)', fontSize:10, fontWeight:700 }}>MagnetoApp UI Kit — Design System 2025</p>
    </div>
  );
}

function App() {
  return <ThemeProvider><AppShell/></ThemeProvider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
