<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F0F4F8; padding: 20px; }
  .label { font-size: 10px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: #737373; margin-bottom: 8px; margin-top: 14px; }
  .label:first-child { margin-top: 0; }
  .input-wrap { position: relative; margin-bottom: 10px; max-width: 340px; }
  .field-label { font-size: 10px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: #737373; margin-bottom: 6px; }
  .input-row {
    display: flex; align-items: center; gap: 12px;
    background: #FFFFFF; border: 1px solid #E8E8E8;
    border-radius: 12px; padding: 0 16px; height: 54px;
  }
  .input-row input {
    border: none; outline: none; background: transparent;
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; color: #1A1A1A; flex: 1;
  }
  .input-row.focused { border-color: #6366F1; border-width: 2px; background: #FFFFFF; }
  .input-row.error { border-color: #EF4444; border-width: 1.5px; }
  .input-row.disabled { opacity: 0.5; }
  .error-text { font-size: 11px; font-weight: 600; color: #EF4444; margin-top: 4px; }
  svg.icon { flex-shrink: 0; }
  .dark-bg { background: #1A2438; padding: 16px; border-radius: 14px; margin-top: 4px; }
  .dark-input {
    display: flex; align-items: center; gap: 12px;
    background: rgba(15,23,42,0.5); border: 1px solid #2D3A52;
    border-radius: 12px; padding: 0 16px; height: 54px;
  }
  .dark-input input {
    border: none; outline: none; background: transparent;
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; color: #F4F7FB; flex: 1;
  }
  .dark-field-label { font-size: 10px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: #7D8CA3; margin-bottom: 6px; }
</style>
</head>
<body>
  <div class="label">Default</div>
  <div class="input-wrap">
    <div class="field-label">Email</div>
    <div class="input-row">
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></svg>
      <input value="fotograf@magneto.ro" readonly>
    </div>
  </div>

  <div class="label">Focused</div>
  <div class="input-wrap">
    <div class="field-label">Parolă <span style="color:#EF4444">*</span></div>
    <div class="input-row focused">
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6366F1" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      <input type="password" value="••••••••" readonly>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="2" style="flex-shrink:0"><path d="M1 12S5 4 12 4s11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </div>
  </div>

  <div class="label">Error</div>
  <div class="input-wrap">
    <div class="field-label">Sumă</div>
    <div class="input-row error">
      <input value="abc" readonly style="color:#EF4444">
    </div>
    <div class="error-text">Introdu o sumă validă.</div>
  </div>

  <div class="label">Disabled</div>
  <div class="input-wrap">
    <div class="field-label">Locație</div>
    <div class="input-row disabled">
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="2"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <input value="Cluj-Napoca" readonly disabled>
    </div>
  </div>

  <div class="label">Dark Mode</div>
  <div class="dark-bg">
    <div class="dark-field-label">Email</div>
    <div class="dark-input" style="margin-bottom: 10px;">
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7D8CA3" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></svg>
      <input value="fotograf@magneto.ro" readonly>
    </div>
    <div class="dark-field-label">Parolă</div>
    <div class="dark-input" style="border-color:#7570F5; border-width:2px;">
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7570F5" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      <input type="password" value="••••••••" readonly>
    </div>
  </div>
</body>
</html>
