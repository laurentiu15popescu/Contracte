<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F0F4F8; padding: 20px; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    width: 90px; height: 100px; background: #fff; border-radius: 12px; padding: 12px 8px;
    border: 1px solid #E8E8E8;
    box-shadow: 0px 4px 16px rgba(0,0,0,0.06);
    cursor: pointer; transition: transform 0.1s;
  }
  .tile:active { transform: scale(0.94); }
  .icon-circle {
    width: 42px; height: 42px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .tile-label { font-size: 10px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: #1A1A1A; text-align: center; }
  .label { font-size: 10px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: #737373; margin-bottom: 10px; margin-top: 14px; }
  .label:first-child { margin-top: 0; }
  .dark-bg { background: #1A2438; padding: 14px; border-radius: 14px; margin-top: 6px; }
  .tile-dark {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    width: 90px; height: 100px; background: #1A2438; border-radius: 12px; padding: 12px 8px;
    border: 1px solid #2D3A52;
    box-shadow: 0px 6px 18px rgba(0,0,0,0.24);
  }
</style>
</head>
<body>
  <div class="label">Quick Action Tiles</div>
  <div class="grid">
    <div class="tile">
      <div class="icon-circle" style="background:rgba(16,185,129,0.18)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
      </div>
      <span class="tile-label">Încasare</span>
    </div>
    <div class="tile">
      <div class="icon-circle" style="background:rgba(99,102,241,0.18)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6366F1" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <span class="tile-label">Program</span>
    </div>
    <div class="tile">
      <div class="icon-circle" style="background:rgba(234,179,8,0.18)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EAB308" stroke-width="2.5"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
      </div>
      <span class="tile-label">Stocuri</span>
    </div>
    <div class="tile">
      <div class="icon-circle" style="background:rgba(239,68,68,0.18)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      </div>
      <span class="tile-label">Echipă</span>
    </div>
    <div class="tile">
      <div class="icon-circle" style="background:rgba(245,158,11,0.18)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </div>
      <span class="tile-label">Salarii</span>
    </div>
    <div class="tile">
      <div class="icon-circle" style="background:rgba(52,202,232,0.18)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#34CAE8" stroke-width="2.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>
      <span class="tile-label">Top</span>
    </div>
  </div>

  <div class="label">Dark Mode</div>
  <div class="dark-bg">
    <div class="grid">
      <div class="tile-dark">
        <div class="icon-circle" style="background:rgba(52,211,153,0.18)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        </div>
        <span style="font-size:10px; font-weight:800; letter-spacing:0.8px; text-transform:uppercase; color:#F4F7FB; text-align:center">Încasare</span>
      </div>
      <div class="tile-dark">
        <div class="icon-circle" style="background:rgba(117,112,245,0.2)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7570F5" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <span style="font-size:10px; font-weight:800; letter-spacing:0.8px; text-transform:uppercase; color:#F4F7FB; text-align:center">Program</span>
      </div>
    </div>
  </div>
</body>
</html>
