<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #E5EAF0; padding: 20px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }

  .stat-card {
    flex: 1; min-width: 160px; background: #fff;
    border-radius: 12px; border: 1px solid #E8E8E8;
    padding: 14px 14px 14px 18px; position: relative; overflow: hidden;
    box-shadow: 0px 4px 20px rgba(0,0,0,0.10);
    min-height: 90px; display: flex; flex-direction: column; justify-content: center;
  }
  .stat-strip {
    position: absolute; left: 0; top: 16px; bottom: 16px; width: 5px; border-radius: 999px;
  }
  .stat-icon-bg {
    position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; border: 1px solid transparent;
  }
  .stat-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; color: #A3A3A3; }
  .stat-value { font-size: 24px; font-weight: 900; letter-spacing: -0.5px; color: #1A1A1A; margin-top: 4px; line-height: 1; }
  .stat-sub { font-size: 10px; color: #A3A3A3; margin-top: 4px; }

  /* success stat */
  .stat-success .stat-strip { background: linear-gradient(to bottom, #10B981, #10B98144); }
  .stat-success .stat-icon-bg { background: rgba(16,185,129,0.18); border-color: rgba(16,185,129,0.1); }

  /* info stat */
  .stat-info .stat-strip { background: linear-gradient(to bottom, #34CAE8, #34CAE844); }
  .stat-info .stat-icon-bg { background: rgba(52,202,232,0.18); border-color: rgba(52,202,232,0.1); }

  /* brand stat */
  .stat-brand .stat-strip { background: linear-gradient(to bottom, #6366F1, #6366F144); }
  .stat-brand .stat-icon-bg { background: rgba(99,102,241,0.18); border-color: rgba(99,102,241,0.1); }

  /* gold stat */
  .stat-gold .stat-strip { background: linear-gradient(to bottom, #EAB308, #EAB30844); }
  .stat-gold .stat-icon-bg { background: rgba(234,179,8,0.18); border-color: rgba(234,179,8,0.1); }

  .icon-svg { width: 22px; height: 22px; }
</style>
</head>
<body>
  <div class="row">
    <div class="stat-card stat-success">
      <div class="stat-strip"></div>
      <div class="stat-icon-bg">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.5"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
      </div>
      <div style="padding-right: 52px;">
        <div class="stat-label">Încasări Azi</div>
        <div class="stat-value">1.850</div>
        <div class="stat-sub">Cash: 1.200 | Card: 650</div>
      </div>
    </div>

    <div class="stat-card stat-info">
      <div class="stat-strip"></div>
      <div class="stat-icon-bg">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="#34CAE8" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <div style="padding-right: 52px;">
        <div class="stat-label">Activitate Azi</div>
        <div class="stat-value">3</div>
        <div class="stat-sub">5 fotografi pe teren</div>
      </div>
    </div>

    <div class="stat-card stat-brand">
      <div class="stat-strip"></div>
      <div class="stat-icon-bg">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="#6366F1" stroke-width="2.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      </div>
      <div style="padding-right: 52px;">
        <div class="stat-label">Fotografi Activi</div>
        <div class="stat-value">12</div>
        <div class="stat-sub">Din 15 în echipă</div>
      </div>
    </div>

    <div class="stat-card stat-gold">
      <div class="stat-strip"></div>
      <div class="stat-icon-bg">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="#EAB308" stroke-width="2.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>
      <div style="padding-right: 52px;">
        <div class="stat-label">Record Lunar</div>
        <div class="stat-value">3.420</div>
        <div class="stat-sub">Atins luna trecută</div>
      </div>
    </div>
  </div>
</body>
</html>
