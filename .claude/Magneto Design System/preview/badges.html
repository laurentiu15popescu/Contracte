<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F0F4F8; padding: 20px; }
  .label { font-size: 10px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: #737373; margin-bottom: 10px; margin-top: 14px; }
  .label:first-child { margin-top: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; align-items: center; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 9999px; border: 1px solid transparent;
    font-size: 12px; font-weight: 700;
  }
  .badge-sm { padding: 4px 8px; font-size: 11px; }
  .badge-lg { padding: 8px 14px; font-size: 13px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .count-badge {
    min-width: 20px; height: 20px; border-radius: 10px;
    background: #EF4444; color: #fff;
    font-size: 10px; font-weight: 900; display: inline-flex;
    align-items: center; justify-content: center; padding: 0 6px;
  }
  .dark-bg { background: #1A2438; padding: 14px; border-radius: 14px; margin-top: 4px; }
</style>
</head>
<body>
  <div class="label">Status Badges — All Sizes</div>
  <div class="row">
    <span class="badge badge-sm" style="background:#ECFDF5;color:#047857"><span class="dot" style="background:#10B981"></span>Confirmat</span>
    <span class="badge" style="background:#ECFDF5;color:#047857"><span class="dot" style="background:#10B981"></span>Confirmat</span>
    <span class="badge badge-lg" style="background:#ECFDF5;color:#047857"><span class="dot" style="background:#10B981"></span>Confirmat</span>
  </div>

  <div class="label">All Variants</div>
  <div class="row">
    <span class="badge" style="background:#ECFDF5;color:#047857"><span class="dot" style="background:#10B981"></span>Confirmat</span>
    <span class="badge" style="background:#FFFBEB;color:#B45309"><span class="dot" style="background:#F59E0B"></span>În așteptare</span>
    <span class="badge" style="background:#FEF2F2;color:#B91C1C"><span class="dot" style="background:#EF4444"></span>Anulat</span>
    <span class="badge" style="background:#EFF6FF;color:#1D4ED8"><span class="dot" style="background:#34CAE8"></span>Informație</span>
    <span class="badge" style="background:#F4F4F5;color:#52525B"><span class="dot" style="background:#A3A3A3"></span>Neutru</span>
  </div>

  <div class="label">Notification / Count Badges</div>
  <div class="row">
    <span class="count-badge">3</span>
    <span class="count-badge" style="background:#6366F1">7</span>
    <span class="count-badge" style="background:#F59E0B">12</span>
    <span class="count-badge">99+</span>
  </div>

  <div class="label">Role & Context</div>
  <div class="row">
    <span class="badge" style="background:rgba(99,102,241,0.15);color:#6366F1;font-size:10px;font-weight:800">🛡️ Admin</span>
    <span class="badge" style="background:rgba(52,202,232,0.15);color:#0891B2;font-size:10px;font-weight:800">📷 Fotograf</span>
    <span class="badge" style="background:#FACC1520;color:#B45309;border-color:#FACC15;font-size:11px;font-weight:800">🏆 #1</span>
    <span class="badge" style="background:#34CAE820;color:#0891B2;border-color:#34CAE8;font-size:11px;font-weight:800">🥈 #2</span>
    <span class="badge" style="background:#6366F120;color:#4F46E5;border-color:#6366F1;font-size:11px;font-weight:800">🥉 #3</span>
  </div>

  <div class="label">Dark Mode</div>
  <div class="dark-bg">
    <div class="row">
      <span class="badge" style="background:#064E3B;color:#6EE7B7"><span class="dot" style="background:#34D399"></span>Confirmat</span>
      <span class="badge" style="background:#422006;color:#FCD34D"><span class="dot" style="background:#FBBF24"></span>Așteptare</span>
      <span class="badge" style="background:#450A0A;color:#FCA5A5"><span class="dot" style="background:#F87171"></span>Anulat</span>
      <span class="badge" style="background:#1E3A5F;color:#93C5FD"><span class="dot" style="background:#5ED4F4"></span>Info</span>
      <span class="badge" style="background:#27272A;color:#A1A1AA"><span class="dot" style="background:#71717A"></span>Neutru</span>
    </div>
  </div>
</body>
</html>
