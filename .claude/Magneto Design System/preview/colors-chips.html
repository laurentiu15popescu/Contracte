<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F0F4F8; padding: 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 9999px; font-size: 11px; font-weight: 700; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
  .label { font-size: 10px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: #737373; margin-bottom: 8px; margin-top: 14px; }
  .label:first-child { margin-top: 0; }
</style>
</head>
<body>
  <div class="label">Light Mode Chips</div>
  <div class="row">
    <span class="chip" style="background:#ECFDF5; color:#047857"><span class="dot" style="background:#10B981"></span>Confirmat</span>
    <span class="chip" style="background:#FFFBEB; color:#B45309"><span class="dot" style="background:#F59E0B"></span>În așteptare</span>
    <span class="chip" style="background:#FEF2F2; color:#B91C1C"><span class="dot" style="background:#EF4444"></span>Anulat</span>
    <span class="chip" style="background:#EFF6FF; color:#1D4ED8"><span class="dot" style="background:#34CAE8"></span>Info</span>
    <span class="chip" style="background:#F4F4F5; color:#52525B"><span class="dot" style="background:#A3A3A3"></span>Neutru</span>
  </div>

  <div class="label">Dark Mode Chips</div>
  <div class="row" style="background:#1E2A40; padding: 12px; border-radius: 12px;">
    <span class="chip" style="background:#064E3B; color:#6EE7B7"><span class="dot" style="background:#34D399"></span>Confirmat</span>
    <span class="chip" style="background:#422006; color:#FCD34D"><span class="dot" style="background:#FBBF24"></span>În așteptare</span>
    <span class="chip" style="background:#450A0A; color:#FCA5A5"><span class="dot" style="background:#F87171"></span>Anulat</span>
    <span class="chip" style="background:#1E3A5F; color:#93C5FD"><span class="dot" style="background:#5ED4F4"></span>Info</span>
    <span class="chip" style="background:#27272A; color:#A1A1AA"><span class="dot" style="background:#71717A"></span>Neutru</span>
  </div>

  <div class="label">Payment Method</div>
  <div class="row">
    <span class="chip" style="background:#ECFDF5; color:#047857; font-size:12px; font-weight:800;">💵 Cash</span>
    <span class="chip" style="background:#EFF6FF; color:#1D4ED8; font-size:12px; font-weight:800;">💳 Card</span>
  </div>

  <div class="label">Role Badge</div>
  <div class="row">
    <span class="chip" style="background: rgba(99,102,241,0.15); color: #6366F1; font-size:10px; font-weight:800; border-radius: 9999px; padding: 4px 10px;">🛡️ Admin</span>
    <span class="chip" style="background: rgba(52,202,232,0.15); color: #0891B2; font-size:10px; font-weight:800; border-radius: 9999px; padding: 4px 10px;">📷 Fotograf</span>
  </div>
</body>
</html>
