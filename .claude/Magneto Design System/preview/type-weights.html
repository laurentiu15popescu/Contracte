<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F0F4F8; padding: 20px; }
  .row { display: flex; align-items: center; gap: 20px; padding: 9px 0; border-bottom: 1px solid #E8E8E8; }
  .row:last-child { border-bottom: none; }
  .meta { font-size: 9px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: #A3A3A3; min-width: 90px; }
  .sample { font-size: 16px; color: #1A1A1A; }
</style>
</head>
<body>
  <div class="row">
    <div class="meta">900 Black</div>
    <div class="sample" style="font-weight:900">1.850 RON — Performanță Maximă</div>
  </div>
  <div class="row">
    <div class="meta">800 Heavy</div>
    <div class="sample" style="font-weight:800">Bună dimineața, Alexandru!</div>
  </div>
  <div class="row">
    <div class="meta">700 Bold</div>
    <div class="sample" style="font-weight:700">Adaugă Încasare Nouă</div>
  </div>
  <div class="row">
    <div class="meta">600 Medium</div>
    <div class="sample" style="font-weight:600">Selectează evenimentul din lista de azi</div>
  </div>
  <div class="row">
    <div class="meta">400 Regular</div>
    <div class="sample" style="font-weight:400">Nicio încasare azi. Validează prima tranzacție.</div>
  </div>
</body>
</html>
