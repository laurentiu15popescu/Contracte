<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F0F4F8; padding: 20px; }
  .section-label { font-size: 10px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: #737373; margin-bottom: 10px; margin-top: 14px; }
  .section-label:first-child { margin-top: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 0 20px; height: 52px; border-radius: 16px; border: 1px solid transparent;
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 800;
    letter-spacing: 0.2px; cursor: pointer; text-decoration: none; white-space: nowrap;
    transition: transform 0.1s, opacity 0.1s;
  }
  .btn:active { transform: scale(0.965); }
  .btn-sm { height: 44px; padding: 0 14px; font-size: 13px; border-radius: 14px; }
  .btn-lg { height: 58px; padding: 0 26px; font-size: 16px; border-radius: 16px; }

  .btn-gradient {
    background: linear-gradient(to right, #6366F1, #4F46E5);
    color: #fff;
    border-color: #4F46E5;
    box-shadow: 0px 6px 18px rgba(79,70,229,0.36);
  }
  .btn-primary {
    background: #6366F1; color: #fff;
    border-color: #4F46E5;
    box-shadow: 0px 4px 14px rgba(99,102,241,0.28);
  }
  .btn-secondary {
    background: #EEF3FF; color: #1A1A1A;
    border-color: #C8D6F2;
    box-shadow: 0px 4px 12px rgba(15,23,42,0.10);
  }
  .btn-ghost {
    background: transparent; color: #1A1A1A;
    border-color: #E8E8E8;
    box-shadow: 0px 3px 10px rgba(15,23,42,0.08);
  }
  .btn-danger {
    background: #FEF2F2; color: #B91C1C;
    border-color: #FECACA;
  }
  .btn-success {
    background: #10B981; color: #fff;
    border-color: #10B981;
    box-shadow: 0px 8px 20px rgba(16,185,129,0.34);
  }
  .btn-warning {
    background: #F59E0B; color: #fff;
    border-color: #F59E0B;
  }
  .btn-disabled {
    background: #6366F1; color: #fff; border-color: #4F46E5; opacity: 0.52; cursor: default;
  }
  .dark-bg { background: #1A2438; padding: 14px; border-radius: 14px; margin-top: 6px; }
  .btn-gradient-dark {
    background: linear-gradient(to right, #7570F5, #6366F1);
    color: #fff; border-color: #818CF8;
    box-shadow: 0px 6px 18px rgba(117,112,245,0.36);
  }
  .btn-primary-dark {
    background: #5ED4F4; color: #0F1626; border-color: #818CF8;
  }
</style>
</head>
<body>
  <div class="section-label">Variants — Light</div>
  <div class="row">
    <button class="btn btn-gradient">Conectare</button>
    <button class="btn btn-primary">Salvează</button>
    <button class="btn btn-secondary">Anulează</button>
    <button class="btn btn-ghost">Detalii</button>
    <button class="btn btn-danger">Șterge</button>
    <button class="btn btn-success">Confirmat</button>
    <button class="btn btn-warning">Atenție</button>
  </div>

  <div class="section-label">Sizes</div>
  <div class="row" style="align-items:center">
    <button class="btn btn-gradient btn-sm">Mic (sm)</button>
    <button class="btn btn-gradient">Mediu (md)</button>
    <button class="btn btn-gradient btn-lg">Mare (lg)</button>
  </div>

  <div class="section-label">With Icons</div>
  <div class="row">
    <button class="btn btn-gradient btn-lg">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      Validare Încasare
    </button>
    <button class="btn btn-success">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      Salvat
    </button>
    <button class="btn btn-ghost">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      Caută
    </button>
  </div>

  <div class="section-label">States</div>
  <div class="row">
    <button class="btn btn-primary">Normal</button>
    <button class="btn btn-disabled" disabled>Dezactivat</button>
    <button class="btn btn-primary" style="transform: scale(0.965)">Apăsat</button>
  </div>

  <div class="section-label">Dark Mode</div>
  <div class="dark-bg">
    <div class="row">
      <button class="btn btn-gradient-dark">Conectare</button>
      <button class="btn btn-primary-dark">Salvează</button>
      <button class="btn" style="background:rgba(148,163,184,0.08); color:#F4F7FB; border-color:#2D3A52;">Ghost</button>
      <button class="btn" style="background:#450A0A; color:#FCA5A5; border-color:#7F1D1D;">Șterge</button>
    </div>
  </div>
</body>
</html>
